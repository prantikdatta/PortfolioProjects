<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        try {
          const prop = 'fetch';
          const target = window;
          const originalFetch = target[prop];
          
          Object.defineProperty(target, prop, {
            get: function() { return originalFetch; },
            set: function(v) { 
              try {
                Object.defineProperty(target, prop, {
                  value: v,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch (e) {}
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
